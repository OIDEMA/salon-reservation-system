steps:
  - id: verify-deployment-target
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - scripts/deploy-native.sh
      - --check
  - id: validate
    name: node:22.23.4-bookworm
    entrypoint: bash
    args:
      - -euc
      - |
        npm ci
        npm ci --workspaces=false --prefix apps/web
        npm run audit:security
        npm run db:generate
        npm run typecheck
        npm run test:operations
        npm run build
        node --test apps/redirect/*.test.mjs apps/api-relay/*.test.mjs
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --tag
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-api:${COMMIT_SHA}-${BUILD_ID}
      - apps/api
  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-api:${COMMIT_SHA}-${BUILD_ID}
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --tag
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-web:${COMMIT_SHA}-${BUILD_ID}
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=https://reservation-api-42401528382.asia-northeast1.run.app
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyDbFdE8AqI9DrTHtQdkKEN92TZ57lmv-rw
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=salon-reserve-bg.firebaseapp.com
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=salon-reserve-bg
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=1:42401528382:web:593b5bb1e23940f3052f6f
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=42401528382
      - apps/web
  - id: verify-web-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euc
      - |
        docker run --detach --name reservation-web-smoke "$$WEB_IMAGE"
        trap 'docker logs reservation-web-smoke; docker rm --force reservation-web-smoke >/dev/null' EXIT
        docker exec reservation-web-smoke node --input-type=module -e '
          import { setTimeout } from "node:timers/promises";
          if (process.version !== "v22.23.4") throw new Error(`Unexpected Node version: $${process.version}`);
          if (process.getuid() === 0) throw new Error("Web container must run as a non-root user");
          let page;
          for (let attempt = 0; attempt < 45; attempt++) {
            try {
              const response = await fetch("http://127.0.0.1:8080/login", { signal: AbortSignal.timeout(5000) });
              if (!response.ok) throw new Error(`Login returned $${response.status}`);
              page = await response.text();
              break;
            } catch (error) {
              if (attempt === 44) throw error;
              await setTimeout(1000);
            }
          }
          if (!page.includes("サロン管理へログイン")) throw new Error("Login page content is missing");
          const assets = [...new Set([...page.matchAll(/(?:src|href)="([^"]*\/_next\/static\/[^"]+)"/g)].map((match) => match[1]))];
          if (!assets.length) throw new Error("Login page has no Next.js static asset");
          for (const path of [...assets, "/brand/beauty-gum-wordmark.webp"]) {
            const response = await fetch(new URL(path, "http://127.0.0.1:8080"), { signal: AbortSignal.timeout(5000) });
            if (!response.ok) throw new Error(`Static asset $${path} returned $${response.status}`);
          }
          console.log("Web image passed: patched Node, non-root runtime, login page, and static assets");
        '
  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-web:${COMMIT_SHA}-${BUILD_ID}
  - id: build-redirect
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --tag
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-redirect:${COMMIT_SHA}-${BUILD_ID}
      - apps/redirect
  - id: verify-redirect-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euc
      - |
        docker run --detach --name reservation-redirect-smoke --env REDIRECT_ORIGIN=https://salon-reserve.beauty-gum.jp "$$REDIRECT_IMAGE"
        trap 'docker logs reservation-redirect-smoke; docker rm --force reservation-redirect-smoke >/dev/null' EXIT
        docker exec reservation-redirect-smoke node --input-type=module -e '
          import { setTimeout } from "node:timers/promises";
          if (process.version !== "v22.23.4") throw new Error(`Unexpected Node version: $${process.version}`);
          if (process.getuid() === 0) throw new Error("Redirect container must run as a non-root user");
          for (let attempt = 0; attempt < 45; attempt++) {
            try {
              const response = await fetch("http://127.0.0.1:8080/healthz", { signal: AbortSignal.timeout(5000) });
              if (!response.ok) throw new Error(`Health returned $${response.status}`);
              break;
            } catch (error) {
              if (attempt === 44) throw error;
              await setTimeout(1000);
            }
          }
          const path = "/mens-gentle/reservations?view=week";
          const response = await fetch("http://127.0.0.1:8080" + path, { redirect: "manual" });
          if (response.status !== 302 || response.headers.get("location") !== process.env.REDIRECT_ORIGIN + path || !response.headers.get("cache-control")?.includes("no-store")) throw new Error("Redirect did not preserve the destination path and query");
          const mutation = await fetch("http://127.0.0.1:8080/api/session", { method: "POST", body: "{}", redirect: "manual" });
          if (mutation.status !== 409 || mutation.headers.has("location")) throw new Error("Redirect must not forward mutation bodies");
          console.log("Redirect image passed: patched Node, non-root runtime, health, path/query, and mutation isolation");
        '
  - id: push-redirect
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-redirect:${COMMIT_SHA}-${BUILD_ID}
  - id: build-api-relay
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --tag
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-api-relay:${COMMIT_SHA}-${BUILD_ID}
      - apps/api-relay
  - id: verify-api-relay-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euc
      - |
        docker run --detach --name reservation-api-relay-smoke --env UPSTREAM_ORIGIN=https://reservation-api-42401528382.asia-northeast1.run.app --env MAINTENANCE_MODE=true "$$API_RELAY_IMAGE"
        trap 'docker logs reservation-api-relay-smoke; docker rm --force reservation-api-relay-smoke >/dev/null' EXIT
        docker exec reservation-api-relay-smoke node --input-type=module -e '
          import { setTimeout } from "node:timers/promises";
          if (process.version !== "v22.23.4" || process.getuid() === 0) throw new Error("Relay must use patched Node and a non-root user");
          for (let attempt = 0; attempt < 45; attempt++) {
            try {
              const response = await fetch("http://127.0.0.1:8080/health", { signal: AbortSignal.timeout(5000) });
              if (!response.ok || !(await response.json()).maintenance) throw new Error("Relay maintenance health failed");
              break;
            } catch (error) {
              if (attempt === 44) throw error;
              await setTimeout(1000);
            }
          }
          for (const method of ["GET", "POST"]) {
            const response = await fetch("http://127.0.0.1:8080/api/tenants", { method, redirect: "manual" });
            if (response.status !== 503 || response.headers.get("retry-after") !== "60" || response.headers.has("location")) throw new Error("Maintenance must block all business requests");
          }
          console.log("API relay image passed: patched Node, non-root runtime, health, and maintenance write fence");
        '
  - id: push-api-relay
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-api-relay:${COMMIT_SHA}-${BUILD_ID}
  - id: deploy-production
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -euc
      - |
        python3 tests/native-deploy.test.py
        python3 tests/native-deploy-commands.test.py
        python3 scripts/native-deploy.py
substitutions:
  _PROJECT_NUMBER: "42401528382"
  _REGION: asia-east1
  _API_SERVICE: reservation-api
  _API_REGION: asia-northeast1
  _DATABASE_URL_SECRET: reservation-database-url-tokyo:1
  _API_RELAY_SERVICE_ACCOUNT: reservation-api-relay@salon-reserve-bg.iam.gserviceaccount.com
  _WEB_REGION: asia-northeast1
  _WEB_SERVICE: salon-reserve-web
  _WEB_RUNTIME_SERVICE_ACCOUNT: firebase-app-hosting-compute@salon-reserve-bg.iam.gserviceaccount.com
  _CHART_PHOTOS_BUCKET: salon-reserve-bg-chart-photos
  _API_RUNTIME_SERVICE_ACCOUNT: reservation-api-runtime@salon-reserve-bg.iam.gserviceaccount.com
  _DB_INSTANCE: salon-reserve-db-tokyo
  _VPC_NETWORK: salon-reserve-vpc
  _VPC_SUBNET: salon-reserve-run-asia-northeast1
  _APP_HOSTING_BACKEND: salon-reserve-web
  # Configure the existing Firebase App Hosting GitHub repository link on the trigger.
  _GIT_REPOSITORY_LINK: ""
serviceAccount: projects/$PROJECT_ID/serviceAccounts/github-deploy@salon-reserve-bg.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - PROJECT_ID=$PROJECT_ID
    - PROJECT_NUMBER=$_PROJECT_NUMBER
    - REGION=$_REGION
    - API_SERVICE=$_API_SERVICE
    - API_REGION=$_API_REGION
    - DATABASE_URL_SECRET=$_DATABASE_URL_SECRET
    - API_RELAY_SERVICE_ACCOUNT=$_API_RELAY_SERVICE_ACCOUNT
    - WEB_REGION=$_WEB_REGION
    - WEB_SERVICE=$_WEB_SERVICE
    - WEB_RUNTIME_SERVICE_ACCOUNT=$_WEB_RUNTIME_SERVICE_ACCOUNT
    - CHART_PHOTOS_BUCKET=$_CHART_PHOTOS_BUCKET
    - API_RUNTIME_SERVICE_ACCOUNT=$_API_RUNTIME_SERVICE_ACCOUNT
    - DB_INSTANCE=$_DB_INSTANCE
    - VPC_NETWORK=$_VPC_NETWORK
    - VPC_SUBNET=$_VPC_SUBNET
    - APP_HOSTING_BACKEND=$_APP_HOSTING_BACKEND
    - GIT_REPOSITORY_LINK=$_GIT_REPOSITORY_LINK
    - COMMIT_SHA=$COMMIT_SHA
    - BUILD_ID=$BUILD_ID
    - API_IMAGE=asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-api:${COMMIT_SHA}-${BUILD_ID}
    - WEB_IMAGE=asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-web:${COMMIT_SHA}-${BUILD_ID}
    - API_RELAY_IMAGE=asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-api-relay:${COMMIT_SHA}-${BUILD_ID}
    - REDIRECT_IMAGE=asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/reservation-redirect:${COMMIT_SHA}-${BUILD_ID}
timeout: 10800s
