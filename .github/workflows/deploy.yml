name: Deploy production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "apps/api/**"
      - "apps/web/**"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: salon-reserve-bg
  PROJECT_NUMBER: "42401528382"
  REGION: asia-east1
  API_SERVICE: reservation-api
  API_RUNTIME_SERVICE_ACCOUNT: reservation-api-runtime@salon-reserve-bg.iam.gserviceaccount.com
  APP_HOSTING_BACKEND: salon-reserve-web
  WIF_PROVIDER: projects/42401528382/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SERVICE_ACCOUNT: github-deploy@salon-reserve-bg.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --workspaces=false --prefix apps/web

      - name: Validate application
        run: |
          npm run db:generate
          npm run typecheck
          npm run build

      - name: Authenticate to Google Cloud for image build
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        env:
          API_IMAGE: asia-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/reservation-api:${{ github.sha }}
        run: |
          docker build --tag "$API_IMAGE" apps/api
          docker push "$API_IMAGE"

      - name: Refresh Google Cloud authentication
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Apply database schema
        env:
          API_IMAGE: asia-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/reservation-api:${{ github.sha }}
        run: |
          gcloud run jobs deploy reservation-db-migrate \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$API_IMAGE" \
            --service-account="$API_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances="$PROJECT_ID:$REGION:salon-reserve-db" \
            --set-secrets=DATABASE_URL=reservation-database-url:latest \
            --command=npm \
            --args=run,prisma:push \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --cpu=1 \
            --memory=512Mi \
            --quiet
          gcloud run jobs execute reservation-db-migrate \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --wait

      - name: Deploy API to Cloud Run
        env:
          API_IMAGE: asia-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/reservation-api:${{ github.sha }}
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --image="$API_IMAGE" \
            --service-account="$API_RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --set-cloudsql-instances="$PROJECT_ID:$REGION:salon-reserve-db" \
            --set-secrets=DATABASE_URL=reservation-database-url:latest \
            --set-env-vars=NODE_ENV=production,CORS_ORIGINS=https://salon-reserve-web--salon-reserve-bg.asia-east1.hosted.app \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=40 \
            --timeout=60 \
            --port=8080 \
            --quiet

      - name: Verify API
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "https://reservation-api-${PROJECT_NUMBER}.${REGION}.run.app/health"

      - name: Refresh Google Cloud authentication for App Hosting
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy frontend to Firebase App Hosting
        run: bash .github/scripts/deploy-app-hosting.sh

      - name: Verify frontend
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "https://salon-reserve-web--salon-reserve-bg.asia-east1.hosted.app" \
            >/dev/null
